<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/icon.png" rel="icon" type="image/png">

    <style>
        html { scroll-behavior: smooth; }
        p { font-size: 1.1rem; margin-bottom: 0.5em; }
        body { line-height: 1.6; }
        a {color: rgb(255, 255, 255);}

        .center-grid { display: grid; place-items: center; }
        .content-area { height: calc(100vh - 25vh); }
        .define-title {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 10px;
            color: #990000;
            margin-top: 1rem;
        }
        .highlight { color: #660000; }
        .highlight_box {
            background: rgb(255, 255, 255);
            padding: 1.8rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0,0,0,0.25);
            margin-top: 1rem;
        }
        .essay-text { max-width: 45vw; }
        .indent { text-indent: 2vw; }
        .essay-text p {
            text-align: justify;
            text-align-last: left;
        }

        .page-body { animation: fadeIn 1s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #robber {
            position: fixed;
            bottom: 20px;
            left: -150px;
            width: 150px;
            height: 150px;
            background: url('/static/robber.png') center/contain no-repeat;
            transition: left 0.6s ease;
            pointer-events: none;
        }
        #fake-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            background: url('/static/cursor.png') center/contain no-repeat;
            display: none;
            pointer-events: auto;
        }
        html.stolen,
        html.stolen body,
        html.stolen * {
            cursor: none !important;
            user-select: none !important;
        }
        body.stolen * {
            cursor: none !important;
            pointer-events: none !important;
            user-select: none !important;
        }
        body.stolen #fake-cursor {
            pointer-events: auto !important;
            cursor: none !important;
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

    <header class="d-flex justify-content-between py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none" style="padding-left: 5vw;">
            <span class="fs-4">What is Justice?</span>
        </a>

        <ul class="nav nav-pills" style="padding-right: 3cm;">
            <li class="nav-item"><a href="/" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="/what-is-justice" class="nav-link">What is Justice?</a></li>
            <li class="nav-item"><a href="/how-medieval-courts-worked" class="nav-link">How Did Medieval Courts Work?</a></li>
            <li class="nav-item"><a href="/punishments-&-crimes" class="nav-link">How Where People Punished, and Why?</a></li>
        </ul>
    </header>

    <div class="container py-4">
        <div class="page-body">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
